{% extends 'base_dashboard.html' %}
{% block title %}Delete Course — NS Classes{% endblock %}
{% block page_title %}Delete Course{% endblock %}
{% block dashboard_body %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white text-center">
            <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i>
            <h4 class="fw-bold mb-2">Delete Course?</h4>
            <p class="text-muted mb-4">
                You are about to delete course <strong>{{ course.name }}</strong>.
            </p>
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'courses:manage_list' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold">Yes, Delete Course</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
